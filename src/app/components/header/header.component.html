<header class="header">
  <div class="header-left">
    <div class="mastek-logo-container">
      <img src="assets/images/mastek-logo.png" alt="Mastek Logo" class="mastek-logo" />
    </div>
    <div class="brand-divider"></div>
    <div class="logo-container">
      <div class="logo-icon">YC</div>
      <div class="company-branding-text">
        <h1 class="company-name">YANBU CEMENT</h1>
        <span class="sub-name">SMART GATE SYSTEM</span>
      </div>
    </div>
  </div>

  <div class="header-right">
    <div class="status-widget">
      <!-- Calendar Icon SVG -->
      <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
      <span class="widget-text">{{ currentDate }}</span>
    </div>

    <div class="status-widget">
      <!-- Clock Icon SVG -->
      <svg class="header-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <span class="widget-text">{{ currentTime }}</span>
    </div>

    <div class="status-widget system-status" [class.system-offline]="!isOnline()">
      <span class="status-dot"></span>
      <span class="status-text">{{ scadaService.systemStatus() | uppercase }}</span>
    </div>
  </div>
</header>
